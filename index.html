<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジャズ・ステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bricolage+Grotesque:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div class="app">
  <header class="top">
    <h1 class="logo">ジャズ・ステップ</h1>
    <button class="inst-btn" id="instBtn" aria-label="楽器をえらぶ">ピアノ</button>
  </header>

  <main id="main">
    <!-- 学ぶ -->
    <section class="view" id="view-learn">
      <div class="today">
        <p class="streak" id="topStat"></p>
        <ol class="menu" aria-label="今日のメニュー（10分）">
          <li>ジャム5分</li>
          <li>レッスン1つ</li>
          <li>耳トレ</li>
        </ol>
        <button class="btn primary" id="nextLessonBtn">続きから始める</button>
      </div>
      <ul class="roadmap" id="roadmap"></ul>
    </section>

    <!-- 耳トレ -->
    <section class="view" id="view-ear" hidden>
      <div class="seg wide" id="earMode">
        <button data-mode="chord" class="on">和音当て</button>
        <button data-mode="copy">まねっこ</button>
        <button data-mode="rhythm">リズム</button>
      </div>
      <div class="ear-head">
        <div class="seg" id="earLevel">
          <button data-level="1" class="on">3種類</button>
          <button data-level="2">4種類</button>
        </div>
        <span class="score" id="earScore">0 / 0</span>
      </div>
      <div class="ear-stage" id="earChord">
        <p class="ear-q">鳴った和音は、どの種類？</p>
        <div class="row">
          <button class="btn play" id="earPlay">▶ 和音</button>
          <button class="btn play ghost" id="earArp">▶ 1音ずつ</button>
        </div>
        <div class="choices" id="earChoices"></div>
        <p class="feedback" id="earFb" aria-live="polite"></p>
        <button class="btn primary" id="earNext" hidden>次の問題</button>
      </div>
      <div class="ear-stage" id="earCopy" hidden>
        <p class="ear-q" id="copyQ">聴いたフレーズを、鍵盤でまねしよう</p>
        <button class="btn play" id="copyPlay">▶ お手本を聴く</button>
        <div class="seg wide small" id="copyInput">
          <button data-in="screen" class="on">画面の鍵盤で</button>
          <button data-in="inst">自分の楽器で</button>
        </div>
        <div class="dots" id="copyDots"></div>
        <div class="kb small" id="copyKb"></div>
        <div class="copy-self" id="copySelf" hidden>
          <button class="btn" id="copyReveal">答えを見る</button>
          <div class="row" id="copyGrade" hidden>
            <button class="btn" id="copyYes">できた！</button>
            <button class="btn ghost" id="copyNo">まだ</button>
          </div>
        </div>
        <p class="feedback" id="copyFb" aria-live="polite"></p>
        <button class="btn primary" id="copyNext" hidden>次のフレーズ</button>
      </div>
      <div class="ear-stage" id="earRhythm" hidden>
        <p class="ear-q">お手本のリズムを、タップでまねしよう</p>
        <p class="rhy-msg" id="rhyMsg"></p>
        <div class="rhy-tl" id="rhyTl"></div>
        <button class="rhy-pad" id="rhyPad">タップ</button>
        <p class="feedback" id="rhyFb" aria-live="polite"></p>
        <div class="row">
          <button class="btn play" id="rhyStart">▶ スタート</button>
          <button class="btn primary" id="rhyNext" hidden>次のリズム</button>
        </div>
      </div>
    </section>

    <!-- ジャム：感覚で遊ぶ -->
    <section class="view" id="view-jam" hidden>
      <div class="prow">
        <label class="field">曲 <select id="jamSong"></select></label>
      </div>
      <div class="seg wide three" id="jamMode">
        <button data-m="watch">お手本を見る</button>
        <button data-m="talk" class="on">会話する</button>
        <button data-m="free">自由に</button>
      </div>
      <div class="jam-now">
        <span class="jam-chord" id="jamChord"></span>
        <div class="tension" aria-label="ドキドキ度">
          <div class="tbar" id="jamTension"><span></span></div>
          <div class="tlab"><span>ほっと</span><span>ドキドキ</span></div>
        </div>
      </div>
      <p class="jam-turn" id="jamTurn"></p>
      <div class="pads" id="jamPads"></div>
      <div class="jam-ctl">
        <button class="btn play" id="jamPlay">▶ スタート</button>
        <div class="knobs">
          <label class="knob">跳ね <input type="range" id="jamSwing" min="50" max="75" step="1"><span id="jamSwingV"></span></label>
          <label class="knob">速さ <input type="range" id="jamBpm" min="70" max="220" step="5"><span id="jamBpmV"></span></label>
        </div>
      </div>
    </section>

    <!-- 練習：楽器の前で、伴奏に合わせて弾く -->
    <section class="view" id="view-keys" hidden>
      <div class="prow">
        <label class="field">曲 <select id="pSong"></select></label>
        <label class="field">キー <select id="pKey"></select></label>
      </div>
      <div class="chips" id="pMode"></div>
      <div id="pPlayer"></div>
      <p class="hint" id="pHint"></p>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-view="learn" class="on"><span class="ti">♪</span>学ぶ</button>
    <button data-view="jam"><span class="ti">◆</span>ジャム</button>
    <button data-view="ear"><span class="ti">◉</span>耳トレ</button>
    <button data-view="keys"><span class="ti">▦</span>練習</button>
  </nav>

  <!-- 楽器えらび -->
  <div class="sheet" id="instSheet" hidden>
    <div class="sheet-body">
      <h2>どの楽器で練習する？</h2>
      <p class="hint">えらんだ楽器に合わせて「どこを弾くか」を表示します。あとから右上で変えられます。</p>
      <div class="inst-list" id="instList"></div>
    </div>
  </div>

  <!-- レッスン画面（全画面） -->
  <div class="lesson" id="lesson" hidden>
    <div class="lesson-top">
      <button class="icon-btn" id="lessonClose" aria-label="閉じる">✕</button>
      <div class="bar"><span id="lessonBar"></span></div>
      <span class="count" id="lessonCount"></span>
    </div>
    <div class="card" id="card"></div>
    <div class="lesson-bottom">
      <button class="btn primary" id="lessonNext">次へ</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
<!--/APP-->
</body>
</html>
