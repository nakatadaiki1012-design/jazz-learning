<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジャズ・ステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bricolage+Grotesque:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div class="app">
  <header class="top">
    <h1 class="logo">ジャズ・ステップ</h1>
    <span class="streak" id="topStat"></span>
  </header>

  <main id="main">
    <!-- 学ぶ -->
    <section class="view" id="view-learn">
      <div class="today">
        <p class="eyebrow">今日のメニュー（10分）</p>
        <ol class="menu">
          <li>レッスン1つ</li>
          <li>耳トレ10問</li>
          <li>ジャズを1曲きく</li>
        </ol>
        <button class="btn primary" id="nextLessonBtn">続きから始める</button>
      </div>
      <p class="eyebrow">ロードマップ</p>
      <ul class="roadmap" id="roadmap"></ul>
    </section>

    <!-- 耳トレ -->
    <section class="view" id="view-ear" hidden>
      <div class="ear-head">
        <div class="seg" id="earLevel">
          <button data-level="1" class="on">3種類</button>
          <button data-level="2">4種類</button>
        </div>
        <span class="score" id="earScore">0 / 0</span>
      </div>
      <div class="ear-stage">
        <p class="ear-q" id="earQ">鳴った和音は、どの種類？</p>
        <div class="row">
          <button class="btn play" id="earPlay">▶ 和音</button>
          <button class="btn play ghost" id="earArp">▶ 1音ずつ</button>
        </div>
        <div class="choices" id="earChoices"></div>
        <p class="feedback" id="earFb" aria-live="polite"></p>
        <button class="btn primary" id="earNext" hidden>次の問題</button>
      </div>
    </section>

    <!-- 鍵盤 -->
    <section class="view" id="view-keys" hidden>
      <div class="keys-controls">
        <label class="field">キー
          <select id="keyRoot"></select>
        </label>
        <div class="chips" id="keyType"></div>
      </div>
      <p class="keys-info" id="keysInfo"></p>
      <div class="kb" id="kb"></div>
      <div class="row three">
        <button class="btn play" id="keysPlay">▶ 鳴らす</button>
        <button class="btn ghost" id="keys251">ii-V-I</button>
        <button class="btn ghost" id="keysBlues">伴奏</button>
      </div>
      <p class="hint">鍵盤はタップで鳴ります。光っている音だけ使えば外れません。</p>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-view="learn" class="on"><span class="ti">♪</span>学ぶ</button>
    <button data-view="ear"><span class="ti">◉</span>耳トレ</button>
    <button data-view="keys"><span class="ti">▦</span>鍵盤</button>
  </nav>

  <!-- レッスン画面（全画面） -->
  <div class="lesson" id="lesson" hidden>
    <div class="lesson-top">
      <button class="icon-btn" id="lessonClose" aria-label="閉じる">✕</button>
      <div class="bar"><span id="lessonBar"></span></div>
      <span class="count" id="lessonCount"></span>
    </div>
    <div class="card" id="card"></div>
    <div class="lesson-bottom">
      <button class="btn primary" id="lessonNext">次へ</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
<!--/APP-->
</body>
</html>
